# config.yaml
# CariSurg ESI Triage Project -- Phase 3 configuration (INTERIM DRAFT)
#
# Every value below is either copied verbatim from a Week 6/7 notebook, or
# explicitly marked TODO where the notebooks did not specify one. Nothing
# here has been invented or "improved."

random_seed: 42            # used throughout every notebook (train_test_split, all model constructors)
test_size: 0.2              # 80/20 split, stratified by target_column

target_column: esi          # Emergency Severity Index, 1 (most urgent) - 5 (least urgent)

data:
  raw_path: "data/raw/yaleemmlc_admissionprediction_triage.csv"
                             # Repo-relative convention, confirmed by project owner.
                             # Actual Colab path this maps to:
                             #   /content/drive/MyDrive/CariSurg/yaleemmlc_admissionprediction_triage.csv
                             # NOTE: this is de-identified/sensitive clinical data. The CSV itself
                             # is git-ignored (see .gitignore) and must NOT be committed to GitHub.
                             # It must be obtained through the approved data-access process --
                             # see docs/HANDOVER.md, Section (d). This path only tells the code where
                             # to look locally once you have a legitimately-obtained copy.
  cleaned_path: "data/processed/triage_cleaned_v1.csv"
                             # RESOLVED: confirmed via Week 5 Tutorial 3, Cell 9 -- this file
                             #   is exactly the output of src.data.clean_triage_data(raw), i.e.
                             #   it is NOT a separately-maintained artifact; regenerate it any
                             #   time by running clean_triage_data() on raw_path above.
                             #
                             # CRITICAL, READ BEFORE USING FOR TRAINING: Week 6 Tutorial 2 (the
                             #   notebook behind the 0.495/0.667 Logistic Regression figures this
                             #   project's Phase 3 recommendation is based on) did NOT actually use
                             #   this cleaned file -- despite its own comment claiming it did, its
                             #   code loaded the RAW csv directly, with zero cleaning applied,
                             #   including the raw row-index column ("Unnamed: 0") as a literal
                             #   model feature. See src/data.py's module docstring
                             #   ("CRITICAL FINDING") and docs/model-selection.md for the full
                             #   writeup. Practical consequence: running
                             #   src.data.clean_triage_data() (the correct pipeline) and retraining
                             #   Logistic Regression will NOT reproduce 0.495/0.667 exactly -- that
                             #   number came from uncleaned data. A clearly labelled legacy function,
                             #   src.data.clean_triage_data_legacy_week6_as_run(), exists solely to
                             #   keep that historical number traceable to real code; it must never
                             #   be used for new training.

split:
  stratify_by: esi
  method: "sklearn.model_selection.train_test_split"

output:
  model_path: "models/final_model.joblib"   # where scripts/train.py saves the fitted model
                                              # (git-ignored -- see .gitignore; a trained model on
                                              # this data may itself be sensitive)

# --------------------------------------------------------------------------
# Final model selection (Week 7 decision journal: 2026-week-7-model-choice.md)
# --------------------------------------------------------------------------
final_model:
  type: LogisticRegression
  preprocessing: StandardScaler
  hyperparameters:
    max_iter: 1000
    random_state: 42

  # Per project decision: the final model uses the Week 7 ENGINEERED
  # feature set (src/data.py: add_clinical_features), not the plain
  # Week 6/7 base feature set.
  feature_set: week7_engineered
  engineered_features:
    - shock_index
    - pulse_pressure
    - spo2_rr_ratio
    - is_tachypneic
    - is_hypoxic
    - is_febrile
    - red_flag_count

  known_metrics:
    macro_f1: NR    # Not Recorded -- see note below
    accuracy: NR
    weighted_f1: NR
    recall_esi1: NR

  note: >
    IMPORTANT: no notebook run trains Logistic Regression on the engineered
    feature set selected above. The only Logistic Regression macro-F1
    figures that exist (0.495 in Week 6, 0.492 in Week 7 Tutorial 2) were
    both measured on the PLAIN feature set -- in Week 7 Tutorial 2, the
    engineered features are added in Cell 22, AFTER the baseline Logistic
    Regression is already scored in Cell 16. ADDITIONALLY (see
    cleaned_path note above): neither of those two existing numbers used
    the canonical cleaning pipeline either -- 0.495 (Week 6) used
    effectively raw, uncleaned data including a leaked index column;
    0.492 (Week 7 Tutorial 2) used a different, non-canonical "compact"
    approximation of cleaning. Confirmed with the project owner that there
    is no additional source notebook or dataset containing Logistic
    Regression measured on BOTH canonical cleaning AND engineered
    features -- it is marked NR (Not Recorded) above, not TODO/null,
    because it genuinely does not exist yet rather than having been lost.
    Closing this requires a NEW verified run
    (src.model.build_logistic_regression() against
    src.data.add_clinical_features(src.data.clean_triage_data(...)) output,
    same seed/split), to be logged as a new dated result, not backfilled
    from the existing 0.492/0.495 numbers, which are both a different
    model input in two different ways.

# --------------------------------------------------------------------------
# Alternatives considered (Weeks 6-7) -- for reference only, not used in
# scripts/train.py. Full detail in docs/model-selection.md.
# --------------------------------------------------------------------------
alternatives_considered:
  - dummy_baseline
  - decision_tree
  - random_forest_default
  - random_forest_tuned
  - gradient_boosting
  - small_mlp
